apiVersion: v1
type: postrenderer/v1
name: local-certificates
version: 0.1.0
runtime: subprocess
runtimeConfig:
  platformCommand:
    - command: yq
      args:
        - '(select(.apiVersion == "cert-manager.io/v1" and .kind == "ClusterIssuer" and .metadata.name == "loco-demo-local").spec) = {"selfSigned": {}}'
