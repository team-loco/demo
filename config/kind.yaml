kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  # Both nodes run workloads: source builds need more CPU than one 4-CPU CI node has left.
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints: []
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1
  - role: worker
