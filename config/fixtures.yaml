services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: loco-demo-postgres
    environment: {POSTGRES_USER: loco, POSTGRES_PASSWORD: loco-demo-database, POSTGRES_DB: loco}
    networks: [kind]
  registry:
    image: ghcr.io/project-zot/zot:v2.1.22@sha256:96cda11459ce6f8c60da3b03f03e9f67fd11b3ae2d82c4c04c92b3c608996080
    container_name: loco-demo-registry
    volumes:
      - ./registry.json:/etc/zot/config.json:ro
      - ./registry.htpasswd:/etc/zot/htpasswd:ro
    networks: [kind]
  s3:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    container_name: loco-demo-s3
    environment:
      ROOT_ACCESS_KEY: loco-demo
      ROOT_SECRET_KEY: loco-demo-storage
      VGW_REGION: us-east-1
      VGW_PORT: ":19000"
      # The API addresses buckets by hostname.
      VGW_VIRTUAL_DOMAIN: s3.loco-demo.localhost
    entrypoint: [sh, -c]
    command: ["mkdir -p /data/loco-sources /data/loco-backups && exec versitygw posix /data"]
    ports: ["127.0.0.1:19000:19000"]
    networks: [kind]
  dex:
    image: ghcr.io/dexidp/dex:v2.46.0@sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777
    container_name: loco-demo-dex
    command: [dex, serve, /etc/dex/config.yaml]
    volumes: [./dex.yaml:/etc/dex/config.yaml:ro]
    ports: ["127.0.0.1:15556:15556"]
    networks: [kind]
networks:
  kind: {external: true}
