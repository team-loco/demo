global:
  domain:
    apps: [demo.test.local]
    platform: platform.test.local
  cloudProvider:
    type: ""
certManager:
  issuer:
    name: loco-demo-local
    type: selfSigned
envoyProxy:
  tracing:
    samplingRate: 100
  service:
    type: NodePort
    externalTrafficPolicy: Cluster
    patch:
      type: StrategicMerge
      value:
        spec:
          ports:
            - port: 80
              nodePort: 30080
