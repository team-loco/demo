apiVersion: v1
kind: Namespace
metadata:
  name: loco-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      automountServiceAccountToken: false
      containers:
      - name: dex
        image: ghcr.io/dexidp/dex:v2.46.0@sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777
        ports:
        - containerPort: 15556
        readinessProbe:
          tcpSocket:
            port: 15556
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        args:
        - dex
        - serve
        - /etc/dex/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/dex
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: dex
---
apiVersion: v1
kind: Service
metadata:
  name: dex
spec:
  type: NodePort
  selector:
    app: dex
  ports:
  - port: 15556
    targetPort: 15556
    nodePort: 30556
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      automountServiceAccountToken: false
      containers:
      - name: s3
        image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
        ports:
        - containerPort: 19000
        readinessProbe:
          tcpSocket:
            port: 19000
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        command:
        - sh
        - -c
        args:
        - mkdir -p /data/loco-sources /data/loco-backups /data/loco-gitops && exec
          versitygw posix /data
        env:
        - name: VGW_REGION
          value: us-east-1
        - name: VGW_PORT
          value: :19000
        - name: VGW_VIRTUAL_DOMAIN
          value: s3.loco-demo.localhost
        - name: ROOT_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3
              key: access-key-id
        - name: ROOT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: s3
              key: secret-access-key
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: s3
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  type: NodePort
  selector:
    app: s3
  ports:
  - port: 19000
    targetPort: 19000
    nodePort: 30900
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
