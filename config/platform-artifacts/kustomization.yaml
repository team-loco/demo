apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loco-demo
resources:
- workloads.yaml
configMapGenerator:
- name: artifacts
  files:
  - config.json=registry.json
secretGenerator:
- name: artifacts
  files:
  - htpasswd=registry.htpasswd
generatorOptions:
  disableNameSuffixHash: true
