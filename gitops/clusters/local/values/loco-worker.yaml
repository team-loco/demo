global:
  platformTelemetry:
    enabled: true
    installation: loco-demo
    cluster: local
    environment: development
  region: local-1
  domain:
    apps:
    - loco-demo-apps.localhost
  exporter:
    endpoint: http://ingest.loco-demo.localhost
env:
  CONTROL_PLANE_URL: http://api.loco-demo.localhost
  LOCO_REGISTRY_HOST: registry.loco-demo.localhost
certManager:
  issuer:
    create: false
    name: loco-demo-selfsigned
    kind: ClusterIssuer
    email: demo@example.test
metrics-server:
  enabled: true
  args:
  - --kubelet-insecure-tls
  replicas: 1
controller:
  image:
    pullPolicy: IfNotPresent
  replicas: 1
builds:
  privateEgress: []
  insecureRegistry: true
  controller:
    replicas: 1
  resources:
    build:
      requests:
        cpu: 500m
registry:
  auth: token
envoyProxy:
  replicas: 1
  autoscaling:
    enabled: false
otel-col-deploy:
  replicaCount: 1
