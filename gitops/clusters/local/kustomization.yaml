apiVersion: kustomize.config.k8s.io/v1beta1
configMapGenerator:
- files:
  - values.yaml=values/loco-control-plane.yaml
  name: loco-control-plane-values
  namespace: flux-system
- files:
  - values.yaml=values/loco-worker.yaml
  name: loco-worker-values
  namespace: flux-system
generatorOptions:
  disableNameSuffixHash: true
kind: Kustomization
patches:
- patch: |-
    - op: replace
      path: /spec/path
      value: ./clusters/local/config
  target:
    kind: Kustomization
    name: loco-cluster-config
resources:
- ../../releases/control-plane.yaml
- ../../bases/all
