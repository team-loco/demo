apiVersion: v1
kind: ConfigMap
metadata:
  name: loco-api-otel
  namespace: loco-system
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      otlp_http:
        endpoint: http://loco-demo-aspire:18890
        compression: none
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loco-api-otel
  namespace: loco-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: loco-api-otel}
  template:
    metadata:
      labels: {app: loco-api-otel}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
        args: ["--config=/conf/config.yaml"]
        ports:
        - {name: otlp-http, containerPort: 4318}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          readOnlyRootFilesystem: true
        resources:
          limits: {cpu: 250m, memory: 256Mi}
        volumeMounts:
        - {name: conf, mountPath: /conf}
      volumes:
      - name: conf
        configMap: {name: loco-api-otel}
---
apiVersion: v1
kind: Service
metadata:
  name: loco-api-otel
  namespace: loco-system
spec:
  selector: {app: loco-api-otel}
  ports:
  - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loco-api-otel
  namespace: loco-system
spec:
  podSelector:
    matchLabels: {app: loco-api-otel}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app: loco-control-plane-api}
    ports:
    - {port: 4318, protocol: TCP}
