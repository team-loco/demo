apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loco
  namespace: flux-system
spec:
  interval: 5m
  path: ./worker
  prune: true
  sourceRef:
    kind: OCIRepository
    name: platform-bundle
  timeout: 30m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loco-cluster-config
  namespace: flux-system
spec:
  dependsOn:
  - name: loco-namespaces
  interval: 5m
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
