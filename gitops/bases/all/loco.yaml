apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loco
  namespace: flux-system
spec:
  interval: 5m
  path: ./all
  prune: true
  sourceRef:
    kind: OCIRepository
    name: platform-bundle
  timeout: 30m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loco-cluster-config
  namespace: flux-system
spec:
  dependsOn:
  - name: loco-namespaces
  - name: loco-postgres-operator
  interval: 5m
  path: ./clusters/local/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loco-postgres
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: OCIRepository
    name: platform-bundle
  path: ./postgres-operator
  prune: true
  wait: true
  timeout: 10m
