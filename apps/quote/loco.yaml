version: 1
partial: quote
services:
  quote:
    runAsUser: 82
    runAsGroup: 82
    port: 8090
    env:
      IPV6_ENABLED: 'false'
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: explicit_bucket_histogram
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_PHP_AUTOLOAD_ENABLED: 'true'
      OTEL_PHP_INTERNAL_METRICS_ENABLED: 'true'
      QUOTE_PORT: '8090'
      OTEL_TRACES_SAMPLER: always_on
    regions:
      us-east-1:
        cpu: 100m
        memory: 512Mi
        replicas:
          min: 1
          max: 1
    image: ghcr.io/open-telemetry/demo:3.1.0-quote@sha256:e0b1ab3784fdbf0112521d3c5c733643f1cefa4eef5f592f845977465400181e
