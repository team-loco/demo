version: 1
partial: product-catalog
services:
  product-catalog:
    port: 3550
    env:
      DB_CONNECTION_STRING: postgres://astronomy_user:astronomy_password@astronomy-db/astronomy_db?sslmode=disable
      FLAGD_HOST: flagd
      FLAGD_PORT: '8013'
      GOMEMLIMIT: 16MiB
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: explicit_bucket_histogram
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_GO_X_OBSERVABILITY: 'true'
      OTEL_SEMCONV_STABILITY_OPT_IN: database
      PRODUCT_CATALOG_PORT: '3550'
      OTEL_TRACES_SAMPLER: always_on
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-col-deploy.loco-obs.svc.cluster.local:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    regions:
      us-east-1:
        cpu: 100m
        memory: 512Mi
        replicas:
          min: 1
          max: 1
    image: ghcr.io/open-telemetry/demo:3.1.0-product-catalog@sha256:7578cbf65fa4f0fc68e077e4f299ecccaa31d9778d407e41ab5973d247fd4b8e
