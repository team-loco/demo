version: 1
partial: shipping
services:
  shipping:
    port: 50050
    env:
      FLAGD_HOST: flagd
      FLAGD_PORT: '8013'
      IPV6_ENABLED: 'false'
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: explicit_bucket_histogram
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      QUOTE_ADDR: http://quote:8090
      SHIPPING_PORT: '50050'
      OTEL_TRACES_SAMPLER: always_on
    regions:
      us-east-1:
        cpu: 100m
        memory: 512Mi
        replicas:
          min: 1
          max: 1
    health:
      path: /health
      interval: 10
      timeout: 5
      failThreshold: 3
      startupGracePeriod: 60
    context: source
    dockerfile: src/shipping/Dockerfile
