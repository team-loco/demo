version: 1
partial: payment
services:
  payment:
    port: 50051
    env:
      FLAGD_HOST: flagd
      FLAGD_PORT: '8013'
      IPV6_ENABLED: 'false'
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: explicit_bucket_histogram
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      PAYMENT_PORT: '50051'
      OTEL_TRACES_SAMPLER: always_on
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-col-deploy.loco-obs.svc.cluster.local:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    regions:
      us-east-1:
        cpu: 100m
        memory: 512Mi
        replicas:
          min: 1
          max: 1
    image: ghcr.io/open-telemetry/demo:3.1.0-payment@sha256:10d6bd20d8a00abe7705d553ab23a4f35e29b2816ab021049e63e89d07cc9192
