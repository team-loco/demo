min_version = "2026.9.15"
[tools]
python = "3.14.8"
uv = "0.12.24"
helm = "4.3.0"
flux2 = "2.10.0"
crane = "0.22.1"
kind = "0.33.0"
kubectl = "1.37.1"
yq = "4.54.1"
go = "1.27.4"
gh = "2.102.0"
actionlint = "1.7.12"
[settings]
lockfile = true
[tasks.setup]
run = ["mise install", "uv sync --locked", "uv run --locked python scripts/demo.py prepare"]
[tasks.validate]
run = "uv run --locked python scripts/demo.py validate"
[tasks.e2e]
run = "uv run --locked python scripts/demo.py e2e"
[tasks.up]
run = "uv run --locked python scripts/demo.py up"
[tasks.forward-https]
description = "Forward localhost port 443 to the demo's app gateway"
run = 'exec sudo "$(mise which kubectl)" --kubeconfig "$PWD/.state/kubeconfig" -n loco-system port-forward --address 127.0.0.1 svc/eg 443:443'
[tasks.reload]
description = "Rebuild Core and update the running demo in place"
run = "uv run --locked python scripts/demo.py reload"
[tasks.deploy]
run = "uv run --locked python scripts/demo.py deploy"
[tasks.verify]
run = "uv run --locked python scripts/demo.py verify"
[tasks.down]
run = "uv run --locked python scripts/demo.py down"
[tasks.report]
run = "uv run --locked python scripts/demo.py report"
[tasks.lint]
run = "actionlint"
[tasks.test]
run = "uv run --locked python -m unittest discover -s tests"
